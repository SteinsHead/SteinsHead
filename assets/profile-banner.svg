<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">SteinsHead — building thoughtful software</title>
  <desc id="desc">A dark blue and violet developer profile banner with an abstract terminal window.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b16"/>
      <stop offset="0.52" stop-color="#101a38"/>
      <stop offset="1" stop-color="#291c4b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#6ee7f9"/>
      <stop offset="0.5" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop stop-color="#7c3aed" stop-opacity=".45"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#9aa8d7" stroke-opacity=".075"/>
    </pattern>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="28" fill="url(#grid)"/>
  <circle cx="1020" cy="30" r="270" fill="url(#glow)"/>
  <circle cx="85" cy="330" r="190" fill="#0ea5e9" opacity=".08"/>

  <g opacity=".8">
    <circle cx="98" cy="72" r="2.2" fill="#e0f2fe"/>
    <circle cx="171" cy="48" r="1.4" fill="#e0f2fe"/>
    <circle cx="258" cy="88" r="1.8" fill="#e0f2fe"/>
    <circle cx="1110" cy="83" r="1.8" fill="#f5d0fe"/>
    <circle cx="1046" cy="300" r="1.5" fill="#f5d0fe"/>
    <circle cx="1151" cy="252" r="2.1" fill="#f5d0fe"/>
  </g>

  <g transform="translate(82 82)">
    <rect x="0" y="4" width="6" height="164" rx="3" fill="url(#accent)"/>
    <text x="34" y="54" fill="#f8fafc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="55" font-weight="750" letter-spacing="1">STEINSHEAD</text>
    <text x="36" y="100" fill="#b8c3e3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="22" letter-spacing="2.4">BUILDING THOUGHTFUL SOFTWARE</text>
    <rect x="36" y="130" width="326" height="2" rx="1" fill="url(#accent)" opacity=".75"/>
    <text x="36" y="166" fill="#91a3cf" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16">AI · DEV TOOLS · LEARNING SYSTEMS</text>
  </g>

  <g transform="translate(760 64)">
    <rect x="-3" y="-3" width="370" height="238" rx="18" fill="#8b5cf6" opacity=".22" filter="url(#softGlow)"/>
    <rect width="370" height="238" rx="18" fill="#080d1c" stroke="#8391be" stroke-opacity=".28" stroke-width="2"/>
    <path d="M0 48H370" stroke="#8391be" stroke-opacity=".22"/>
    <circle cx="24" cy="24" r="5" fill="#fb7185"/>
    <circle cx="43" cy="24" r="5" fill="#fbbf24"/>
    <circle cx="62" cy="24" r="5" fill="#4ade80"/>
    <text x="88" y="30" fill="#7180aa" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12">~/ideas</text>

    <text x="27" y="87" fill="#67e8f9" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16">❯</text>
    <text x="52" y="87" fill="#dbeafe" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16">turn curiosity into code</text>
    <text x="27" y="124" fill="#67e8f9" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16">❯</text>
    <text x="52" y="124" fill="#c4b5fd" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16">design for humans</text>
    <text x="27" y="161" fill="#67e8f9" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16">❯</text>
    <text x="52" y="161" fill="#f9a8d4" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16">ship, learn, repeat</text>
    <rect x="28" y="191" width="10" height="19" rx="2" fill="#67e8f9">
      <animate attributeName="opacity" values="1;.2;1" dur="1.3s" repeatCount="indefinite"/>
    </rect>
  </g>

  <rect x="1" y="1" width="1198" height="358" rx="27" fill="none" stroke="#c4b5fd" stroke-opacity=".18" stroke-width="2"/>
</svg>