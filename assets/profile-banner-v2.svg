<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">SteinsHead — building thoughtful software</title>
  <desc id="desc">A dark blue and violet developer profile banner with an abstract terminal window.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b16"/>
      <stop offset="0.52" stop-color="#101a38"/>
      <stop offset="1" stop-color="#291c4b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#6ee7f9"/>
      <stop offset="0.5" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop stop-color="#7c3aed" stop-opacity=".42"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#9aa8d7" stroke-opacity=".07"/>
    </pattern>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="26" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="26" fill="url(#grid)"/>
  <circle cx="1030" cy="24" r="250" fill="url(#glow)"/>
  <circle cx="88" cy="304" r="175" fill="#0ea5e9" opacity=".075"/>

  <g opacity=".78">
    <circle cx="98" cy="58" r="2.1" fill="#e0f2fe"/>
    <circle cx="175" cy="40" r="1.3" fill="#e0f2fe"/>
    <circle cx="272" cy="72" r="1.7" fill="#e0f2fe"/>
    <circle cx="1110" cy="68" r="1.7" fill="#f5d0fe"/>
    <circle cx="1050" cy="276" r="1.4" fill="#f5d0fe"/>
    <circle cx="1150" cy="230" r="2" fill="#f5d0fe"/>
  </g>

  <g transform="translate(76 72)">
    <rect x="0" y="2" width="5" height="148" rx="2.5" fill="url(#accent)"/>
    <text x="32" y="49" fill="#f8fafc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="51" font-weight="700" letter-spacing=".7">STEINSHEAD</text>
    <text x="34" y="90" fill="#bec9e7" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="19" font-weight="500" letter-spacing="2.2">BUILDING THOUGHTFUL SOFTWARE</text>
    <rect x="34" y="116" width="294" height="2" rx="1" fill="url(#accent)" opacity=".72"/>
    <text x="34" y="148" fill="#93a5cf" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15" letter-spacing=".2">AI · DEV TOOLS · LEARNING SYSTEMS</text>
  </g>

  <g transform="translate(770 54)">
    <rect x="-3" y="-3" width="360" height="218" rx="17" fill="#8b5cf6" opacity=".2" filter="url(#softGlow)"/>
    <rect width="360" height="218" rx="17" fill="#080d1c" stroke="#8391be" stroke-opacity=".3" stroke-width="2"/>
    <path d="M0 44H360" stroke="#8391be" stroke-opacity=".22"/>
    <circle cx="23" cy="22" r="4.5" fill="#fb7185"/>
    <circle cx="41" cy="22" r="4.5" fill="#fbbf24"/>
    <circle cx="59" cy="22" r="4.5" fill="#4ade80"/>
    <text x="83" y="27" fill="#7180aa" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5">~/ideas</text>

    <text x="26" y="79" fill="#67e8f9" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15">❯</text>
    <text x="50" y="79" fill="#dbeafe" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15">turn curiosity into code</text>
    <text x="26" y="113" fill="#67e8f9" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15">❯</text>
    <text x="50" y="113" fill="#c4b5fd" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15">design for humans</text>
    <text x="26" y="147" fill="#67e8f9" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15">❯</text>
    <text x="50" y="147" fill="#f9a8d4" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15">ship, learn, repeat</text>
    <rect x="27" y="176" width="9" height="17" rx="2" fill="#67e8f9">
      <animate attributeName="opacity" values="1;.2;1" dur="1.3s" repeatCount="indefinite"/>
    </rect>
  </g>

  <rect x="1" y="1" width="1198" height="318" rx="25" fill="none" stroke="#c4b5fd" stroke-opacity=".18" stroke-width="2"/>
</svg>